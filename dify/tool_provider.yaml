identity:
  name: catalog_validator
  author: Grammar Validator Team
  label:
    en_US: Catalog Grammar Validator
    ru_RU: Валидатор грамматики каталогов
  description:
    en_US: Validates Russian grammar and case agreement in product catalogs
    ru_RU: Проверяет русскую грамматику и согласование падежей в каталогах товаров
  icon: validator.svg
  tags:
