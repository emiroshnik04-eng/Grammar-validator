      en_US: API Key
      ru_RU: API Ключ
    placeholder:
      en_US: Enter your API key if authentication is enabled
      ru_RU: Введите API ключ если аутентификация включена

tools:
  - validate_catalog.yaml
  - suggest_category_name.yaml
  - check_health.yaml
